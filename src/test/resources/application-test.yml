spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///testdb
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: test-secret-key-for-testing-purposes-only-do-not-use-in-prod
  expiration-ms: 3600000

rate-limit:
  requests-per-second: 1000
  burst-capacity: 2000

logging:
  level:
    root: WARN
    com.projectmgmt: INFO
